android.useAndroidX=true
android.newDsl=false
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g

# Build speed: 23 modules, so build them in parallel and reuse last build's outputs.
org.gradle.parallel=true
org.gradle.caching=true
kotlin.incremental=true


# Flow Neuroengine
FLOW_NEURO_BASE_URL=https://api.flowneuroengine.com
FLOW_NEURO_API_KEY=dummy_key
android.useFullClasspathForDexingTransform=true
android.suppressUnsupportedCompileSdk=37
android.suppressUnsupportedCompileSdk=37,37.0
